name: Keep Virtual Office Awake 24/7
on:
  schedule:
    # يعمل كل 10 دقائق مجاناً لإبقاء السيرفر مستيقظاً على Render
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Office Health Endpoint
        env:
          OFFICE_URL: ${{ secrets.OFFICE_URL }}
        run: |
          TARGET="${OFFICE_URL:-https://ai-virtual-office-24-7.onrender.com}"
          curl -fsS "${TARGET%/}/health"
