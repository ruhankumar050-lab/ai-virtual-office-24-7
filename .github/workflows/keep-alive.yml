name: Keep Virtual Office Awake 24/7
on:
  schedule:
    # يعمل كل 10 دقائق مجاناً لإبقاء السيرفر مستيقظاً على Render أو Koyeb
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Office Health Endpoint
        env:
          OFFICE_URL: ${{ secrets.OFFICE_URL }}
        run: |
          if [ -n "$OFFICE_URL" ]; then
            curl -fsS "${OFFICE_URL%/}/health" || exit 1
          else
            echo "Set OFFICE_URL secret in GitHub repo settings (e.g. https://your-app.onrender.com)"
          fi
