services:
  - type: web
    name: ai-virtual-office-24-7
    runtime: node
    plan: free
    buildCommand: "echo 'No external dependencies required'"
    startCommand: "node server.js"
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: builtin
      - key: AI_API_KEY
        sync: false
      - key: AI_BACKUP_PROVIDER
        value: none
      - key: AI_BACKUP_API_KEY
        sync: false
